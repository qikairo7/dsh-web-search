- id: web
  config:
    searchProvider: auto
    fetchProvider: auto

# Keep the first-party tool layer enabled; this plugin supplies only providers.
- id: tool-web
  disabled: false
  config:
    search: true
    fetch: true

# The plugin owns the direct-HTTP fetch provider, so the shipped HTTP provider
# must not register the same `http` id in this profile.
- id: web-fetch-http
  disabled: true

- insert:
    - id: web-search-router
      name: '@qikairo7/dsh-web-search'
      config:
        searchMode: quality
        fetchMode: fast
        intentRouting: true
        languageRouting: true
        officialDocsEnabled: true
        aihotEnabled: true
        chineseSearchOrder: zhihu,anysearch,tavily,firecrawl
        defaultSearchOrder: anysearch,tavily,zhihu,firecrawl
        fetchOrder: http,tavily,firecrawl,anysearch
        cleanFetchOrder: tavily,firecrawl,http,anysearch
