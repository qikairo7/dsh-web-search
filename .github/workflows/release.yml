name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.12.0"
        required: true
        type: string

permissions:
  contents: write
  checks: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # 预算自洽：等待循环最多 30 分钟（60 × 30 秒，见下方等待步骤），被等待的 check 自身
    # 上限 15 分钟（check.yml 的 timeout-minutes: 15），两者都要落在本 job 的预算内，
    # 再留出 checkout/install/pack/release 的余量，所以取 45（30 等待 + 15 构建发布）。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Wait for green checks on the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 打 tag 会立刻触发构建；先要求被 tag 的 commit 在 main 上的 check 全绿。
          # main 的 check 若被新推送取消，就没有跑完的绿跑可等（magpie 丢版本教训 #1846）。
          # 用 checkout 后的 HEAD 解析被发布的 commit：tag push 时即 tag 指向的 commit，
          # workflow_dispatch 时也不受 GITHUB_SHA（派发 ref 的 SHA）影响。
          SHA=$(git rev-parse HEAD)
          required=(
            'check'
            'full-matrix (ubuntu-latest, 22)'
            'full-matrix (windows-latest, 24)'
          )
          # 预算：60 轮 × 30 秒 ≈ 30 分钟，须落在 job 的 timeout-minutes: 45 之内。
          first_check=1
          for attempt in $(seq 1 60); do
            if ! runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv'); then
              echo "waiting: gh api failed (attempt $attempt/60); retry after 30s"
              [[ "$attempt" == "60" ]] || sleep 30
              continue
            fi
            # 首检：required 名单是 check.yml matrix 的手抄拷贝，第一次拿到结果时校验名字是否对得上，
            # 对不上说明 matrix 已改、名单漂移，立即失败而不是空等 30 分钟。
            # 空 runs（tag 后 check 尚未创建）不算漂移，跳过首检走正常等待分支。
            if [[ "$first_check" == "1" && -n "$runs" ]]; then
              first_check=0
              missing=()
              for want in "${required[@]}"; do
                printf '%s\n' "$runs" | awk -F'\t' -v n="$want" '$1 == n { found = 1 } END { if (found) exit 0; exit 1 }' || missing+=("$want")
              done
              if (( ${#missing[@]} > 0 )); then
                echo "::error::required check 名单与实际 check 不符，检查 check.yml matrix 是否已变（缺少：${missing[*]}）"
                exit 1
              fi
            fi
            ok=1
            for want in "${required[@]}"; do
              line=$(printf '%s\n' "$runs" | awk -F'\t' -v n="$want" '$1 == n { print; exit }')
              if [[ -z "$line" ]]; then
                ok=0
                echo "waiting: $want has not started"
                continue
              fi
              status=$(printf '%s' "$line" | cut -f2)
              conclusion=$(printf '%s' "$line" | cut -f3)
              if [[ "$status" != "completed" ]]; then
                ok=0
                echo "waiting: $want is $status"
              elif [[ "$conclusion" != "success" ]]; then
                echo "::error::required check failed: $want is $conclusion"
                exit 1
              fi
            done
            if [[ "$ok" == "1" ]]; then
              echo "all required checks are green on $SHA"
              exit 0
            fi
            [[ "$attempt" == "60" ]] || sleep 30
          done
          echo "::error::timed out after ~30 minutes waiting for green checks on $SHA"
          exit 1

      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Check tag and package version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          [[ "$TAG" =~ ^v[0-9] ]] || { echo "bad tag: $TAG" >&2; exit 1; }
          VERSION="${TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "tag $TAG does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v version="$VERSION" '
            $0 ~ "^## " version "([ —-]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi

      - name: Pack installable tarball
        id: pack
        shell: bash
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist
          TARBALL=$(find dist -maxdepth 1 -name '*.tgz' -print -quit)
          if [[ -z "$TARBALL" ]]; then
            echo "pnpm pack produced no tarball" >&2
            exit 1
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          ls -l "$TARBALL"

      - name: Smoke check tarball entries
        shell: bash
        run: |
          # Minimal "can the shipped artifact load" gate: unpack and syntax-check
          # the export entries. Not an install test - it catches a broken publish
          # (missing entry, bad transform) before the release goes out.
          TMP=$(mktemp -d)
          tar -xzf "${{ steps.pack.outputs.tarball }}" -C "$TMP"
          node --check "$TMP/package/lib/index.js"
          node --check "$TMP/package/client.js"

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          # Single source of truth for asset integrity: checksums are computed
          # from the exact tarballs uploaded by the release step below.
          (cd dist && sha256sum -- *.tgz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.pack.outputs.tarball }}" \
            dist/SHA256SUMS \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file notes.md \
            --verify-tag
