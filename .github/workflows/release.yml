name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.12.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Check tag and package version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          [[ "$TAG" =~ ^v[0-9] ]] || { echo "bad tag: $TAG" >&2; exit 1; }
          VERSION="${TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "tag $TAG does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v version="$VERSION" '
            $0 ~ "^## " version "([ —-]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi

      - name: Pack installable tarball
        id: pack
        shell: bash
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist
          TARBALL=$(find dist -maxdepth 1 -name '*.tgz' -print -quit)
          if [[ -z "$TARBALL" ]]; then
            echo "pnpm pack produced no tarball" >&2
            exit 1
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          ls -l "$TARBALL"

      - name: Smoke check tarball entries
        shell: bash
        run: |
          # Minimal "can the shipped artifact load" gate: unpack and syntax-check
          # the export entries. Not an install test - it catches a broken publish
          # (missing entry, bad transform) before the release goes out.
          TMP=$(mktemp -d)
          tar -xzf "${{ steps.pack.outputs.tarball }}" -C "$TMP"
          node --check "$TMP/package/lib/index.js"
          node --check "$TMP/package/client.js"

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          # Single source of truth for asset integrity: checksums are computed
          # from the exact tarballs uploaded by the release step below.
          (cd dist && sha256sum -- *.tgz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.pack.outputs.tarball }}" \
            dist/SHA256SUMS \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file notes.md \
            --verify-tag
