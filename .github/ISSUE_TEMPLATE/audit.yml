name: 审计发现
description: 审查/实测/复盘发现的代码或文档问题（审计类）
title: "[audit] "
labels: [审计]
body:
  - type: dropdown
    id: issue-origin
    attributes:
      label: 来源
      options:
        - 真实环境实测复现
        - 审查/复盘推断（AI 辅助），未实测复现
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 发现出处
      description: 哪次审查/链/复盘（PR 号或实例日期）。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题与证据
      description: 实际观察到的输出、失败或代码位置；猜测不写。
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影响面
    validations:
      required: true
  - type: dropdown
    id: blocking
    attributes:
      label: 阻塞级别
      options:
        - 不阻塞（建议）
        - 影响正确性（应尽快修）
    validations:
      required: true
