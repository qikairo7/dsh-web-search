name: Bug 报告
description: 报告与预期不符的行为
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。粘贴日志前请先删掉 API Key 与 token。

  - type: input
    id: env-plugin
    attributes:
      label: 插件版本
      description: 设置 → 插件 里显示的版本，或 package.json 中的 version。
      placeholder: 0.13.2
    validations:
      required: true

  - type: input
    id: env-dsh
    attributes:
      label: DSH 版本
      placeholder: 0.2.2-rc.5
    validations:
      required: true

  - type: input
    id: env-node
    attributes:
      label: Node.js 版本
      placeholder: 22.19.0 或 24.20.0
    validations:
      required: true

  - type: dropdown
    id: env-os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 贴准确报错；先删掉 key 与 token。
      render: text
    validations:
      required: true

  - type: textarea
    id: root-cause
    attributes:
      label: 根因线索（可选）
      description: 若已定位到相关文件、Provider 或请求路径，写在这里。
