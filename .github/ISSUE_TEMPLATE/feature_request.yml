name: 功能请求
description: 提出新能力或对可观察行为的有意调整
title: "[Feature] "
labels: [enhancement]
body:
  - type: dropdown
    id: issue-origin
    attributes:
      label: 来源
      options:
        - 真实使用场景
        - 辅助分析建议
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决什么
      description: 现在有什么问题、谁受影响、为什么要改。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 描述用户、模型或系统可见的行为。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 考虑过的变通做法或其他设计。

  - type: dropdown
    id: scope
    attributes:
      label: 预估改动面
      description: 此选择用于路由审查强度，不确定就选不确定。
      options:
        - fast-lane（≤30 行，不碰 lib/ 与 .github/ 与 schema）
        - 碰 lib/ 或 scripts/
        - 碰 schema 或 .github/
        - 不确定
      default: 3
