name: Task
description: Track a scoped implementation or maintenance task
title: "[Task] "
labels: [task]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to be done, and why?
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: List the files, behavior, or evidence that proves the task is complete.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will a reviewer verify the result?
    validations:
      required: true
