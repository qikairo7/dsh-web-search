name: 治理任务
description: 工具、流程、文档、治理类任务（Task/follow-up）
title: "[Task] "
labels: [task]
body:
  - type: markdown
    attributes:
      value: |
        内部治理与跟踪单。请写实测现状，别抄过期数字。
  - type: dropdown
    id: issue-origin
    attributes:
      label: 来源
      options:
        - 真实环境实测发现
        - 审查/复盘推断（AI 辅助）
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景与现状实测
      description: 问题是什么；现状给实测数字或命令输出（版本、余量、计数）。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方向
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收点
      description: 每条可核对；容量/预算类写明规格锚点（如「可容纳一条与现存最短行同规格的新条目」）。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 涉及范围
      description: 预计触碰的文件或模块。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 已搜索过现有 issue，无重复单。
          required: true
        - label: 不包含 API Key、token 或私密地址。
          required: true
